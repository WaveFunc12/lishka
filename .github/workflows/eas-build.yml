name: EAS build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: eas.json build profile
        default: simulator
  push:
    branches: [claude/eas-build-2-rxj2bm]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - run: eas build -p ios --profile ${{ inputs.profile || 'simulator' }} --non-interactive --no-wait
